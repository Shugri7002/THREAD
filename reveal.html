<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THREAD - What Connects Them?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="preview-body">
    <main class="page preview-page">
        <header class="header quick-header">
            <a href="topic.html"><img src="assets/reveal-logo.svg" alt="THREAD" width="85" height="30"></a>
            <a class="back-button" href="topic.html#connection-choices" aria-label="Back to connection choices">
                <img src="assets/reveal-back.svg" alt="" width="16" height="16">
            </a>
        </header>

        <div class="preview-journey">
            <section class="preview-question">
                <h1><img src="assets/reveal-question.svg" alt="What connects them?" width="314" height="62"></h1>
                <p>FOLLOW THE THREAD</p>
            </section>

            <section class="preview-subject">
                <div class="preview-photo">
                    <img src="assets/reveal-frank.png" alt="Frank Ocean wearing headphones">
                </div>
                <div class="preview-caption">
                    <p class="preview-category">MUSIC</p>
                    <h2 class="preview-name">
                        <img src="assets/reveal-frank-title.svg" alt="Frank Ocean" width="195" height="19">
                    </h2>
                </div>
            </section>

            <div class="preview-thread" aria-hidden="true">
                <img src="assets/reveal-thread.svg" alt="" width="372" height="88">
            </div>

            <section class="preview-subject preview-selected" id="selected-subject">
                <div class="preview-photo">
                    <img id="selected-photo" alt="" hidden>
                </div>
                <div class="preview-caption">
                    <p class="preview-category" id="selected-category"></p>
                    <h2 class="preview-name">
                        <span id="selected-name"></span>
                        <img id="selected-title" alt="" hidden>
                    </h2>
                </div>
            </section>
        </div>

        <div class="preview-action">
            <a class="reveal-button" href="connection.html">
                <img src="assets/reveal-action-title.svg" alt="Reveal connection" width="135" height="9">
                <img src="assets/reveal-action-arrow.svg" alt="" width="12" height="12">
            </a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
