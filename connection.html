<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THREAD - The Connection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="preview-body">
    <main class="page preview-page connection-page">
        <header class="header quick-header">
            <a href="topic.html"><img src="assets/connection-logo.svg" alt="THREAD" width="85" height="30"></a>
            <a class="back-button" href="reveal.html" aria-label="Back to the reveal">
                <img src="assets/reveal-back.svg" alt="" width="16" height="16">
            </a>
        </header>

        <div class="connection-content">
            <h1 class="connection-heading">
                <img src="assets/connection-heading.svg" alt="The Connection" width="318" height="25">
            </h1>

            <section class="reveal-pair" aria-label="Connected subjects">
                <article class="preview-subject connection-subject">
                    <div class="connection-photo">
                        <img src="assets/reveal-frank.png" alt="Frank Ocean wearing headphones">
                    </div>
                    <p class="preview-category">MUSIC</p>
                    <h2 class="preview-name connection-name">
                        <img src="assets/connection-frank-title.svg" alt="Frank Ocean" width="125" height="12">
                    </h2>
                </article>

                <article class="preview-subject preview-selected connection-subject" id="selected-subject">
                    <div class="connection-photo">
                        <img id="selected-photo" alt="" hidden>
                    </div>
                    <p class="preview-category" id="selected-category"></p>
                    <h2 class="preview-name connection-name">
                        <span id="selected-name"></span>
                        <img id="selected-title" alt="" hidden>
                    </h2>
                </article>
            </section>

            <section class="connection-story" aria-label="Connection explanation">
                <p id="connection-text"></p>
                <div class="takeaway" id="connection-takeaway">
                    <p class="label">IN ONE LINE</p>
                    <p id="takeaway-text"></p>
                </div>
            </section>
        </div>

        <div class="preview-action">
            <a class="reveal-button" href="topic.html#connection-choices">
                <img src="assets/connection-continue.svg" alt="Continue thread" width="120" height="9">
                <img src="assets/reveal-action-arrow.svg" alt="" width="12" height="12">
            </a>
            <a class="view-route-link" href="route.html">View Your Route</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
