<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THREAD - Explore on Your Own</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="preview-body">
    <main class="page preview-page explore-page">
        <header class="header quick-header explore-header">
            <a href="route.html"><img src="assets/explore-logo.svg" alt="THREAD" width="85" height="30"></a>
        </header>

        <section class="explore-intro">
            <h1><img src="assets/explore-heading.svg" alt="Explore on your own" width="333" height="75"></h1>
            <p>Where do you want to go next?</p>
        </section>

        <section class="explore-grid" aria-label="Topics to explore">
            <article class="explore-card explore-fashion">
                <img class="explore-shape" src="assets/explore-fashion-card.svg" alt="" width="163" height="163">
                <img class="explore-image" src="assets/explore-fashion.png" alt="Models posing in an ornate room" width="246" height="260">
                <h2><img src="assets/explore-fashion-title.svg" alt="Fashion as Expression" width="87" height="5"></h2>
                <button class="explore-card-arrow" type="button" disabled aria-label="Fashion as Expression (coming soon)">
                    <img src="assets/explore-fashion-arrow.svg" alt="" width="14" height="14">
                </button>
            </article>

            <article class="explore-card explore-cinema">
                <img class="explore-shape" src="assets/explore-cinema-card.svg" alt="" width="163" height="163">
                <img class="explore-image" src="assets/explore-cinema.png" alt="A colorful collage of portraits" width="246" height="260">
                <img class="explore-image" src="assets/explore-cinema-outline.svg" alt="">
                <h2><img src="assets/explore-cinema-title.svg" alt="Queer Cinema" width="73" height="8"></h2>
                <button class="explore-card-arrow" type="button" disabled aria-label="Queer Cinema (coming soon)">
                    <img src="assets/explore-cinema-arrow.svg" alt="" width="14" height="14">
                </button>
            </article>

            <article class="explore-card explore-video">
                <img class="explore-shape" src="assets/explore-video-card.svg" alt="" width="163" height="163">
                <img class="explore-image" src="assets/explore-video.png" alt="A grid of video screens showing landscapes" width="246" height="260">
                <h2><img src="assets/explore-video-title.svg" alt="Video Art" width="53" height="7"></h2>
                <button class="explore-card-arrow" type="button" disabled aria-label="Video Art (coming soon)">
                    <img src="assets/explore-video-arrow.svg" alt="" width="14" height="14">
                </button>
            </article>

            <article class="explore-card explore-sound">
                <img class="explore-shape" src="assets/explore-sound-card.svg" alt="" width="163" height="163">
                <img class="explore-image" src="assets/explore-sound.png" alt="An installation of speakers in a gallery" width="246" height="260">
                <h2><img src="assets/explore-sound-title.svg" alt="Sound Art" width="57" height="7"></h2>
                <button class="explore-card-arrow" type="button" disabled aria-label="Sound Art (coming soon)">
                    <img src="assets/explore-sound-arrow.svg" alt="" width="14" height="14">
                </button>
            </article>

            <article class="explore-card explore-books">
                <img class="explore-shape" src="assets/explore-books-card.svg" alt="" width="163" height="163">
                <img class="explore-image" src="assets/explore-books.png" alt="A collage of book covers" width="246" height="260">
                <h2><img src="assets/explore-books-title.svg" alt="Queer Literature" width="95" height="8"></h2>
                <button class="explore-card-arrow" type="button" disabled aria-label="Queer Literature (coming soon)">
                    <img src="assets/explore-books-arrow.svg" alt="" width="14" height="14">
                </button>
            </article>

            <article class="explore-card explore-photo">
                <img class="explore-shape" src="assets/explore-photo-card.svg" alt="" width="163" height="163">
                <img class="explore-image" src="assets/explore-photo.png" alt="A black-and-white photograph of a stone building" width="246" height="260">
                <h2><img src="assets/explore-photo-title.svg" alt="Monochrome Photography" width="54" height="13"></h2>
                <button class="explore-card-arrow" type="button" disabled aria-label="Monochrome Photography (coming soon)">
                    <img src="assets/explore-photo-arrow.svg" alt="" width="14" height="14">
                </button>
            </article>
        </section>

        <p class="explore-availability">These topics are coming soon.</p>

        <div class="preview-action">
            <a class="reveal-button" href="index.html" onclick="startNewThread()">
                <img src="assets/explore-restart-title.svg" alt="Start a new thread" width="139" height="9">
                <img src="assets/explore-restart-arrow.svg" alt="" width="12" height="12">
            </a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
